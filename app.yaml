# =============================================================================
# Databricks Apps configuration for nao
# =============================================================================
# Apps run this `command` (argv, not a shell) from the synced source root on a
# managed Node 22 + Python 3.11 runtime. start.sh orchestrates the FastAPI
# sidecar + the Bun-based nao backend and binds the backend to DATABRICKS_APP_PORT.
#
# Resources (Lakebase database, SQL warehouse, serving endpoint) are attached to
# the app and surface as env vars below via `valueFrom`. Names must match the
# resource keys configured on the app (see databricks.yml / deploy/README.md).
# -----------------------------------------------------------------------------
command: ["bash", "deploy/databricks/start.sh"]

env:
  # ---- Runtime ----
  # NOTE: do NOT set NODE_ENV=production here — it makes the Apps build run
  # `npm install --omit=dev`, dropping vite and the frontend build fails.
  # start.sh sets NODE_ENV=production for the backend process at runtime.
  # NAO_MODE defaults to "self-hosted"; leave unset.
  # Single sign-on passthrough: trust Databricks Apps' X-Forwarded-Email so the
  # Databricks login is the only login (no nao sign-in screen). Auto-provision users.
  - name: NAO_SSO_PASSTHROUGH
    value: "true"
  - name: ENABLE_USER_SIGNUP
    value: "true"
  # Public app URL for Better Auth cookies / trusted origins.
  - name: BETTER_AUTH_URL
    value: "https://nao-7474646562526015.aws.databricksapps.com"
  # Lakebase instance name, used to mint a Postgres OAuth credential if the
  # database resource doesn't inject a static password.
  - name: DATABRICKS_DATABASE_INSTANCE
    value: "nao-db"
  - name: NAO_CONTEXT_SOURCE
    value: "local"

  # ---- Metadata DB: Lakebase (Postgres). Attaching the `lakebase` database
  #      resource auto-injects PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD;
  #      start.sh assembles DB_URI from them. DB_SSL forces TLS (Lakebase needs it).
  - name: DB_SSL
    value: "true"

  # ---- Analytics data: Databricks SQL warehouse (read by nao's connector).
  #      The app service principal authenticates via OAuth; nao's Databricks
  #      connection config is generated from these by deploy/databricks/render-config.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  # Scope nao's analytics connection. Use a catalog/schema the app SP can WRITE
  # to (nao creates temp volumes/tables) — not a read-only catalog like `samples`.
  - name: NAO_DATABRICKS_CATALOG
    value: "nao_demo_catalog"
  - name: NAO_DATABRICKS_SCHEMA
    value: "nao_data"
  - name: NAO_DATABRICKS_TEMP_SCHEMA
    value: "nao_data"

  # ---- LLM: Databricks Foundation Model serving (OpenAI chat-completions API).
  #      DATABRICKS_HOST is injected by the platform; the `databricks` provider
  #      builds baseURL = $DATABRICKS_HOST/serving-endpoints.
  - name: NAO_LLM_PROVIDER
    value: "databricks"
  - name: NAO_DATABRICKS_LLM_ENDPOINT
    value: "databricks-claude-sonnet-4-5"

  # ---- Auth ----
  # BETTER_AUTH_URL is derived from DATABRICKS_APP_URL at runtime in start.sh.
  # Stable secret (from the `better-auth-secret` secret resource) so the Better
  # Auth JWKS stays decryptable across restarts — an ephemeral secret breaks
  # login with "Failed to decrypt private key".
  - name: BETTER_AUTH_SECRET
    valueFrom: "better-auth-secret"
